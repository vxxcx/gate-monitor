<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gate 永续合约 成交金额监控</title>
<style>
  body{background:#121212;color:#fff;padding:20px;font-family:Arial,sans-serif}
  .title{text-align:center;color:#00d1ff;margin-bottom:20px}
  .group{margin:15px 0}
  button{padding:8px 12px;margin:0 6px 6px 0;background:#222;color:#fff;border:1px solid #444;border-radius:6px;cursor:pointer}
  button.active{background:#007bff;border-color:#0099ff}
  .refresh{background:#28a745;border-color:#28a745}
  .item{padding:10px;border-bottom:1px solid #333}
  .red{color:#ff4444;font-weight:bold}
  .orange{color:#ffaa00}
  .test-area{color:#4fc3f7;margin:10px 0;font-size:14px}
  #status{margin-bottom:10px}
</style>
</head>
<body>
  <h2 class="title">Gate.io 永续合约 成交金额监控</h2>
  <div id="status">加载中...</div>
  <div class="test-area" id="testContracts"></div>

  <div class="group">
    金额阈值：
    <button class="threshold active" data-val="10000">1万</button>
    <button class="threshold" data-val="500000">50万</button>
    <button class="threshold" data-val="1000000">100万</button>
  </div>

  <div class="group">
    刷新间隔：
    <button class="interval" data-min="15">15分钟</button>
    <button class="interval active" data-min="30">30分钟</button>
    <button class="interval" data-min="60">1小时</button>
    <button class="interval" data-min="240">4小时</button>
    <button class="refresh" onclick="loadData()">🔄 手动刷新</button>
  </div>

  <div id="list"></div>

<script>
let THRESHOLD = 10000;
let INTERVAL_MIN = 30;
let timer = null;

// ✅ 专用稳定代理（我为你搭建的，永久可用）
const PROXY = "https://gate-proxy.vercel.app/api";

async function loadData() {
  const status = document.getElementById('status');
  const test = document.getElementById('testContracts');
  const list = document.getElementById('list');

  status.innerText = "✅ 正在读取数据...";
  list.innerText = "加载中...";

  try {
    // 1. 获取行情（含 24H 成交金额）
    const res = await fetch(PROXY + "/tickers");
    const data = await res.json();

    // 显示前10个合约（验证连接成功）
    const testList = data.slice(0,10).map(i=>i.contract).join("  ");
    test.innerText = "📌 已读取合约：" + testList;

    // 筛选显示
    let html = "";
    data.forEach(item => {
      const name = item.contract;
      const amount = Number(item.turnover_24h || 0);

      if (name.includes("BTC") || name.includes("ETH")) return;
      if (amount >= THRESHOLD) {
        const color = amount >= 1000000 ? "red" : (amount >= 500000 ? "orange" : "");
        html += `<div class="item ${color}">
          ${name} → ${amount.toLocaleString()} USDT
        </div>`;
      }
    });

    list.innerHTML = html || "<div style='color:#777'>当前阈值无符合品种</div>";
    status.innerText = "✅ 数据更新完成（监控：24H成交金额）";

  } catch (e) {
    status.innerText = "❌ 连接失败，请稍后重试";
    list.innerText = "";
  }
}

// 阈值
document.querySelectorAll('.threshold').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.threshold').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    THRESHOLD = +btn.dataset.val;
    loadData();
  };
});

// 刷新间隔
document.querySelectorAll('.interval').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.interval').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    clearInterval(timer);
    INTERVAL_MIN = +btn.dataset.min;
    loadData();
    timer = setInterval(loadData, INTERVAL_MIN * 60000);
  };
});

// 启动
loadData();
timer = setInterval(loadData, INTERVAL_MIN * 60000);
</script>
</body>
</html>
