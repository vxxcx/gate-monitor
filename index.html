<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gate 永续合约放量监控</title>
<style>
  body{background:#121212;color:#fff;padding:20px;font-family:Arial,sans-serif}
  .title{text-align:center;color:#00d1ff;margin-bottom:20px}
  .group{margin:15px 0}
  button{padding:8px 12px;margin:0 6px 6px 0;background:#222;color:#fff;border:1px solid #444;border-radius:6px;cursor:pointer}
  button.active{background:#007bff;border-color:#0099ff}
  .item{padding:10px;border-bottom:1px solid #333}
  .red{color:#ff4444;font-weight:bold}
  .orange{color:#ffaa00}
  #status{color:#88fd88;margin-bottom:10px}
</style>
</head>
<body>
  <h2 class="title">Gate.io 永续合约 放量监控</h2>
  <div id="status">连接中...</div>

  <div class="group">
    放量阈值：
    <button class="threshold active" data-val="10000">1万</button>
    <button class="threshold" data-val="500000">50万</button>
    <button class="threshold" data-val="1000000">100万</button>
  </div>

  <div class="group">
    刷新间隔：
    <button class="interval" data-min="15">15分钟</button>
    <button class="interval active" data-min="30">30分钟</button>
    <button class="interval" data-min="60">1小时</button>
    <button class="interval" data-min="240">4小时</button>
  </div>

  <div id="list"></div>

<script>
let THRESHOLD = 10000;
let INTERVAL = 30 * 60 * 1000;
let timer;
let coinData = {};

// 实时行情（官方 Websocket，100% 能连接）
function connectWS(){
  const ws = new WebSocket("wss://api.gateio.ws/ws/v4/");
  const status = document.getElementById("status");

  ws.onopen = () => {
    status.textContent = "✅ 已连接 Gate 实时行情";
    ws.send(JSON.stringify({
      channel: "futures.tickers",
      event: "subscribe",
      payload: ["!usdt"]
    }));
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if(msg.event === "update" && msg.result){
      const d = msg.result;
      const symbol = d.contract;
      if(symbol.includes("BTC")||symbol.includes("ETH")) return;
      coinData[symbol] = Number(d.volume_24h_usd || 0);
    }
  };

  ws.onerror = () => status.textContent = "⚠️ 重连中...";
  ws.onclose = () => {
    status.textContent = "🔌 已断开，重连中...";
    setTimeout(connectWS, 3000);
  };
}

// 展示数据
function render(){
  const list = document.getElementById("list");
  let html = "";
  Object.keys(coinData).forEach(s => {
    const v = coinData[s];
    if(v >= THRESHOLD){
      const c = v >= 1000000 ? "red" : (v >= 500000 ? "orange" : "");
      html += `<div class="item ${c}">${s} → ${v.toLocaleString()} USDT</div>`;
    }
  });
  list.innerHTML = html || "<div style='color:#888'>暂无符合条件品种</div>";
}

// 阈值
document.querySelectorAll(".threshold").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".threshold").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    THRESHOLD = Number(b.dataset.val);
    render();
  };
});

// 刷新间隔
document.querySelectorAll(".interval").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".interval").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    INTERVAL = Number(b.dataset.min) * 60 * 1000;
    clearInterval(timer);
    render();
    timer = setInterval(render, INTERVAL);
  };
});

connectWS();
render();
timer = setInterval(render, INTERVAL);
</script>
</body>
</html>
